[package]
name = "autoclicktimer"
version = "1.3.0"
edition = "2021"
authors = ["Xpl4iN"]
description = "AutoClick Timer -- Native Windows Automation Utility"

[dependencies]
slint = "1.9"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_Security",
    "Win32_Graphics_Gdi",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5"
chrono = "0.4"
arboard = "3.4"
rfd = "0.15"
ureq = { version = "2.10", features = ["json", "tls"] }

[build-dependencies]
slint-build = "1.9"
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
